<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Js Interiorismo · App de cliente (concepto)</title>
  <meta name="description" content="Concepto de app para clientes de Js Interiorismo — Jorge Santana, diseño de interiores en Aguascalientes. Avances, renders, aprobaciones, acabados en 3D y agenda.">
  <meta name="theme-color" content="#F3EEE7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Js Studio">
  <meta property="og:title" content="Js Interiorismo · App de cliente">
  <meta property="og:description" content="Tu proyecto, en tu mano. Concepto de app por Shaf3ool.">
  <meta property="og:image" content="img/bano-sereno-1.webp">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body>
  <div class="stagebg" aria-hidden="true"></div>

  <!-- Desktop-only presentation copy beside the phone frame -->
  <aside class="side">
    <p class="side__k" data-t="side.k"></p>
    <h1 class="side__t" data-t="side.t"></h1>
    <p class="side__p" data-t="side.p"></p>
    <div class="side__lang lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang-btn="es" aria-pressed="true">ES</button><button type="button" data-lang-btn="en" aria-pressed="false">EN</button>
    </div>
    <p class="side__n" data-t="side.note"></p>
  </aside>

  <div class="device">
    <div class="app" data-app>
      <!-- Onboarding / splash -->
      <section class="ob" data-ob>
        <img class="ob__bg" src="img/bano-sereno-1.webp" alt="" width="1800" height="2250">
        <div class="ob__lang"><div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang-btn="es" aria-pressed="true">ES</button><button type="button" data-lang-btn="en" aria-pressed="false">EN</button></div></div>
        <p class="ob__k" data-t="ob.k"></p>
        <h2 class="ob__t" data-t="ob.t"></h2>
        <p class="ob__p" data-t="ob.p"></p>
        <button type="button" class="ob__cta" data-enter><span data-t="ob.cta"></span><i aria-hidden="true">→</i></button>
        <p class="ob__n" data-t="ob.note"></p>
      </section>

      <header class="top">
        <div class="brand">Js <b>Studio</b></div>
        <div class="top__r">
          <span class="chip">Demo</span>
          <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang-btn="es" aria-pressed="true">ES</button><button type="button" data-lang-btn="en" aria-pressed="false">EN</button></div>
        </div>
      </header>

      <main class="views" data-views></main>

      <nav class="tabbar" aria-label="Secciones" data-tabbar>
        <button type="button" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="tab.home"></span></button>
        <button type="button" data-go="project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 4v16"/></svg><span data-t="tab.project"></span></button>
        <button type="button" data-go="design"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 3 8l9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg><span data-t="tab.design"></span></button>
        <button type="button" data-go="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/></svg><span data-t="tab.chat"></span><em class="badge" data-badge>1</em></button>
        <button type="button" data-go="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-t="tab.agenda"></span></button>
      </nav>

      <div class="scrim" data-scrim></div>
      <section class="sheet" data-sheet aria-modal="true" role="dialog"></section>
      <div class="toast" data-toast role="status" aria-live="polite"></div>
      <section class="lbx" data-lbx hidden></section>
      <section class="arv" data-arv hidden></section>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
