<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <!-- Js Interiorismo · Taller (3 proyecciones) · app prototype · Concept by Shaf3ool -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Taller · Js Interiorismo (prototipo)</title>
  <meta name="description" content="Taller de Js Interiorismo: ajusta las medidas de tu espacio, acomoda productos y trabaja en planta, alzado frontal y alzado lateral. Guarda y envía tus 3 proyecciones. Prototipo web instalable.">
  <meta name="theme-color" content="#EFE6D8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Js Taller">
  <meta property="og:title" content="Taller · Js Interiorismo">
  <meta property="og:description" content="Diseña tu espacio en 3 proyecciones: planta, alzado frontal y lateral.">
  <meta property="og:image" content="icons/og.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/DMSans-normal-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="desk">
  <!-- desktop: side copy next to the phone frame (framed mode only) -->
  <aside class="side">
    <p class="eyebrow">Js Interiorismo · <span data-i18n="demo">Demo</span></p>
    <h1 class="side-h" data-i18n="sideTitle">Taller de proyecciones</h1>
    <p class="side-p" data-i18n="sideBody"></p>
    <button class="btn ghost" id="bDesk" type="button" data-i18n="deskView">Vista de escritorio</button>
    <p class="side-note" data-i18n="proto"></p>
  </aside>

  <div class="device"><div class="device-screen">
    <div id="app">
      <div class="statusbar" aria-hidden="true"><span id="sbTime">9:41</span><i class="island"></i>
        <span class="sb-icons"><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="17" height="8" rx="2"/><rect x="24" y="4" width="1.6" height="4" rx=".8" opacity=".5"/></svg></span>
      </div>

      <!-- header: brand, project name, actions -->
      <header class="top">
        <div class="brand">
          <span class="mark">Js<i>.</i></span>
          <div class="titles">
            <h1 data-i18n="title">Taller</h1>
            <div class="prow"><em class="pill" data-i18n="demo">Demo</em><button class="pname" id="pName" type="button" data-i18n-aria="projName">Sala-comedor</button></div>
          </div>
        </div>
        <div class="acts">
          <button class="btn ghost wide-only" id="bPhone" type="button" data-i18n="phoneView">Ver en iPhone</button>
          <button class="icon-btn" id="bProjects" type="button" data-i18n-aria="projects"><svg viewBox="0 0 24 24" width="21" height="21"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.2h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
          <button class="icon-btn" id="bExport" type="button" data-i18n-aria="export"><svg viewBox="0 0 24 24" width="21" height="21"><path d="M12 3.5v11M7.5 8 12 3.5 16.5 8M5 13.5V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="lang" id="bLang" type="button" data-i18n="lang">EN</button>
          <button class="btn ghost wide-only" id="bSave2" type="button" data-i18n="save">Guardar</button>
          <button class="btn primary wide-only" id="bSend2" type="button" data-i18n="send">Enviar a Jorge</button>
        </div>
      </header>

      <div class="work">
        <!-- room dimensions + (desktop) catalogue + inspector -->
        <aside class="panel">
          <section class="room card" id="room">
            <button class="room-sum" id="roomSum" type="button" aria-expanded="false">
              <span class="lbl" data-i18n="room">Habitación</span>
              <span class="val" id="roomVal">480 × 620 × 270 cm</span>
              <svg class="chev" viewBox="0 0 24 24" width="18" height="18"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
            <div class="room-body" id="roomBody"></div>
          </section>
          <section class="cat-inline">
            <div class="sec-h"><h2 data-i18n="catalog">Catálogo de Jorge</h2><span class="muted small" data-i18n="catalogNote"></span></div>
            <div class="cat-grid" id="catInline"></div>
          </section>
          <div class="insp-home" id="inspHome"></div>
        </aside>

        <!-- the drawings -->
        <section class="stagewrap">
          <nav class="seg" id="seg" role="tablist">
            <button role="tab" data-view="plan" class="on" data-i18n="planShort">Planta</button>
            <button role="tab" data-view="front" data-i18n="frontShort">Frontal</button>
            <button role="tab" data-view="side" data-i18n="sideShort">Lateral</button>
            <i class="seg-thumb" aria-hidden="true"></i>
          </nav>
          <div class="viewcap"><span class="vk" id="vKey">01</span><span id="vName" data-i18n="plan">Planta</span><span class="vsub" id="vSub"></span></div>
          <div class="stage" id="stage"></div>
          <p class="hint" id="hint" data-i18n="tapHint"></p>
          <p class="credit"><span data-i18n="credit1">Concept by Shaf3ool</span> · <span data-i18n="credit2">Renders © Jorge Santana / Js Interiorismo</span></p>
        </section>
      </div>

      <!-- inspector for the selected piece (moved between phone dock / desktop panel) -->
      <div class="insp card" id="insp" hidden></div>

      <!-- phone dock -->
      <footer class="dock">
        <button class="dk" id="bCat" type="button"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="catShort">Catálogo</span></button>
        <button class="dk" id="bSave" type="button"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 4h9l3 3v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM8 4v5h7V4M8 20v-6h8v6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span data-i18n="save">Guardar</span></button>
        <button class="dk send" id="bSend" type="button"><span data-i18n="send">Enviar a Jorge</span><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </footer>

      <div id="sheets"></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
  </div></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
